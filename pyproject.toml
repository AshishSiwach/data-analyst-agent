[project]
name = "data-analyst-agent"
version = "0.1.0"
description = "Descriptive SQL analyst agent for a Shopify-shaped e-commerce dataset, with a result-based eval harness."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "sqlglot>=30.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data_analyst_agent*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
